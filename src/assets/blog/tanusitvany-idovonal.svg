<text x="124" y="350" font-size="13.5" font-weight="600" fill="#4C7A5E" text-anchor="start">Érvényes 5 évig a kiállítástól – több eladáshoz vagy bérbeadáshoz is felhasználható</text>
<text x="40" y="396" font-size="12.5" font-weight="400" fill="#4A5668" text-anchor="start">A 2023. november 1. előtt kiállított, régi rendszerű tanúsítványok ma már nem használhatók.</text>
