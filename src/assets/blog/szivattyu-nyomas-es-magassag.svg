<text x="40" y="48" font-size="13" font-weight="700" fill="#0A5AD1" letter-spacing="1.6">AZ EMELŐMAGASSÁG NYOMÁS, NEM MAGASSÁG</text><path d="M40 62H760" stroke="#E2E8F0" stroke-width="1"/>
<rect x="90" y="100" width="40" height="240" fill="#FFFFFF" stroke="#0B1626" stroke-width="2"/><rect x="92" y="220" width="36" height="118" fill="#BFDBFE"/><path d="M90 220H130" stroke="#3B82F6" stroke-width="3"/><path d="M130 340h16" stroke="#0B1626" stroke-width="1.4"/><path d="M130 316h9" stroke="#0B1626" stroke-width="1.4"/><path d="M130 292h9" stroke="#0B1626" stroke-width="1.4"/><path d="M130 268h9" stroke="#0B1626" stroke-width="1.4"/><path d="M130 244h9" stroke="#0B1626" stroke-width="1.4"/><path d="M130 220h16" stroke="#0B1626" stroke-width="1.4"/><path d="M130 196h9" stroke="#0B1626" stroke-width="1.4"/><path d="M130 172h9" stroke="#0B1626" stroke-width="1.4"/><path d="M130 148h9" stroke="#0B1626" stroke-width="1.4"/><path d="M130 124h9" stroke="#0B1626" stroke-width="1.4"/><path d="M130 100h16" stroke="#0B1626" stroke-width="1.4"/><text x="156" y="344" font-size="13" font-weight="400" fill="#4A5668" text-anchor="start">0 m</text><text x="156" y="224" font-size="13" font-weight="400" fill="#4A5668" text-anchor="start">5 m</text><text x="156" y="104" font-size="13" font-weight="400" fill="#4A5668" text-anchor="start">10 m</text><text x="110" y="372" font-size="12.5" font-weight="700" fill="#0B1626" text-anchor="middle">vízoszlop</text><rect x="240" y="150" width="110" height="190" fill="#F5F8FC" stroke="#0B1626" stroke-width="1.6"/><text x="295" y="190" font-size="13" font-weight="700" fill="#0A5AD1" text-anchor="middle">NYOMÁS</text><text x="295" y="216" font-size="15" font-weight="700" fill="#0B1626" text-anchor="middle">0,5 bar</text><text x="295" y="240" font-size="12.5" font-weight="400" fill="#4A5668" text-anchor="middle">= 5 m</text><text x="295" y="258" font-size="12.5" font-weight="400" fill="#4A5668" text-anchor="middle">vízoszlop</text><rect x="390" y="92" width="370" height="262" fill="#FFFFFF" stroke="#0B1626" stroke-width="1.6"/><text x="410" y="122" font-size="13" font-weight="700" fill="#0A5AD1" text-anchor="start">ÁTVÁLTÁS, AMIT ÉRDEMES MEGJEGYEZNI</text><text x="410" y="156" font-size="17" font-weight="700" fill="#0B1626" text-anchor="start">1 méter  ≈  0,1 bar  ≈  9,8 kPa</text><text x="410" y="186" font-size="17" font-weight="700" fill="#0B1626" text-anchor="start">10 méter  ≈  1 bar</text><text x="410" y="226" font-size="14" font-weight="400" fill="#4A5668" text-anchor="start">Egy 5 m-es emelőmagasságú szivattyú</text><text x="410" y="246" font-size="14" font-weight="400" fill="#4A5668" text-anchor="start">tehát kb. 0,5 bar nyomáskülönbséget</text><text x="410" y="266" font-size="14" font-weight="400" fill="#4A5668" text-anchor="start">hoz létre a két csonkja között.</text><rect x="410" y="290" width="330" height="40" fill="#F5F8FC" stroke="#3B82F6" stroke-width="2.4"/><text x="575" y="316" font-size="14.5" font-weight="700" fill="#0A5AD1" text-anchor="middle">Nem azt mondja meg, milyen magasra visz.</text></svg>