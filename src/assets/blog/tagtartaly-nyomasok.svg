<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Nyomások a tágulási tartálynál egy 6 m magas rendszerben: statikus nyomás 0,6 bar, előfeszítés 1,1 bar, hidegen 1,4 bar, 60 °C-on 2,2 bar, végnyomás 2,5 bar, lefúvási nyomás 3,0 bar" font-family="Inter, 'Inter Variable', 'Segoe UI', Arial, sans-serif">
<rect width="800" height="400" fill="#F5F8FC"/><g stroke="#0B1626" stroke-opacity="0.05"><path d="M0 0V400"/><path d="M32 0V400"/><path d="M64 0V400"/><path d="M96 0V400"/><path d="M128 0V400"/><path d="M160 0V400"/><path d="M192 0V400"/><path d="M224 0V400"/><path d="M256 0V400"/><path d="M288 0V400"/><path d="M320 0V400"/><path d="M352 0V400"/><path d="M384 0V400"/><path d="M416 0V400"/><path d="M448 0V400"/><path d="M480 0V400"/><path d="M512 0V400"/><path d="M544 0V400"/><path d="M576 0V400"/><path d="M608 0V400"/><path d="M640 0V400"/><path d="M672 0V400"/><path d="M704 0V400"/><path d="M736 0V400"/><path d="M768 0V400"/><path d="M800 0V400"/><path d="M0 0H800"/><path d="M0 32H800"/><path d="M0 64H800"/><path d="M0 96H800"/><path d="M0 128H800"/><path d="M0 160H800"/><path d="M0 192H800"/><path d="M0 224H800"/><path d="M0 256H800"/><path d="M0 288H800"/><path d="M0 320H800"/><path d="M0 352H800"/><path d="M0 384H800"/></g>
<text x="40" y="48" font-size="13" font-weight="700" fill="#0A5AD1" letter-spacing="1.6">A NYOMÁSOK EGY 6 M MAGAS RENDSZERNÉL</text><path d="M40 62H760" stroke="#E2E8F0" stroke-width="1"/>
<path d="M120 360V90" stroke="#0B1626" stroke-width="2"/><path d="M114 360h6" stroke="#0B1626"/><text x="108" y="364" font-size="12" font-weight="400" fill="#4A5668" text-anchor="end">0</text><path d="M114 321.42857142857144h6" stroke="#0B1626"/><text x="108" y="325.42857142857144" font-size="12" font-weight="400" fill="#4A5668" text-anchor="end">0,5</text><path d="M114 282.8571428571429h6" stroke="#0B1626"/><text x="108" y="286.8571428571429" font-size="12" font-weight="400" fill="#4A5668" text-anchor="end">1</text><path d="M114 244.28571428571428h6" stroke="#0B1626"/><text x="108" y="248.28571428571428" font-size="12" font-weight="400" fill="#4A5668" text-anchor="end">1,5</text><path d="M114 205.71428571428572h6" stroke="#0B1626"/><text x="108" y="209.71428571428572" font-size="12" font-weight="400" fill="#4A5668" text-anchor="end">2</text><path d="M114 167.14285714285714h6" stroke="#0B1626"/><text x="108" y="171.14285714285714" font-size="12" font-weight="400" fill="#4A5668" text-anchor="end">2,5</text><path d="M114 128.57142857142858h6" stroke="#0B1626"/><text x="108" y="132.57142857142858" font-size="12" font-weight="400" fill="#4A5668" text-anchor="end">3</text><text x="108" y="82" font-size="12" font-weight="400" fill="#4A5668" text-anchor="end">bar</text><rect x="122" y="167.14285714285714" width="46" height="84.85714285714286" fill="#A7F3D0"/><path d="M120 128.57142857142858L330 99" stroke="#C0392B" stroke-width="2" fill="none"/><circle cx="120" cy="128.57142857142858" r="3.5" fill="#C0392B"/><text x="340" y="104" font-size="15" font-weight="700" fill="#C0392B" text-anchor="start">psv = 3,0 bar</text><text x="340" y="122" font-size="12.5" font-weight="400" fill="#4A5668" text-anchor="start">lefúvási nyomás: itt nyit a biztonsági szelep</text><path d="M120 167.14285714285714L330 145" stroke="#0A5AD1" stroke-width="2" fill="none"/><circle cx="120" cy="167.14285714285714" r="3.5" fill="#0A5AD1"/><text x="340" y="150" font-size="15" font-weight="700" fill="#0A5AD1" text-anchor="start">pe = 2,5 bar</text><text x="340" y="168" font-size="12.5" font-weight="400" fill="#4A5668" text-anchor="start">megengedett végnyomás (0,9 · psv, de min. 0,5 bar-ral alatta)</text><path d="M120 193.37142857142854L330 191" stroke="#0B1626" stroke-width="2" fill="none"/><circle cx="120" cy="193.37142857142854" r="3.5" fill="#0B1626"/><text x="340" y="196" font-size="15" font-weight="700" fill="#0B1626" text-anchor="start">2,2 bar</text><text x="340" y="214" font-size="12.5" font-weight="400" fill="#4A5668" text-anchor="start">nyomás a legmelegebb (60 °C-os) állapotban</text><path d="M120 252L330 237" stroke="#0A5AD1" stroke-width="2" fill="none"/><circle cx="120" cy="252" r="3.5" fill="#0A5AD1"/><text x="340" y="242" font-size="15" font-weight="700" fill="#0A5AD1" text-anchor="start">1,4 bar</text><text x="340" y="260" font-size="12.5" font-weight="400" fill="#4A5668" text-anchor="start">nyomás hidegen (10 °C); a legmagasabb ponton 0,8 bar</text><path d="M120 275.1428571428571L330 283" stroke="#0284C7" stroke-width="2" fill="none"/><circle cx="120" cy="275.1428571428571" r="3.5" fill="#0284C7"/><text x="340" y="288" font-size="15" font-weight="700" fill="#0284C7" text-anchor="start">p0 = 1,1 bar</text><text x="340" y="306" font-size="12.5" font-weight="400" fill="#4A5668" text-anchor="start">a tartály előfeszítése (h/10 + min. 0,5 bar, 0,1-re kerekítve)</text><path d="M120 313.7142857142857L330 329" stroke="#4A5668" stroke-width="2" fill="none"/><circle cx="120" cy="313.7142857142857" r="3.5" fill="#4A5668"/><text x="340" y="334" font-size="15" font-weight="700" fill="#4A5668" text-anchor="start">h/10 = 0,6 bar</text><text x="340" y="352" font-size="12.5" font-weight="400" fill="#4A5668" text-anchor="start">a 6 m magas vízoszlop statikus nyomása</text><text x="176" y="221.28571428571428" font-size="12" font-weight="700" fill="#047857" text-anchor="start">üzemi tartomány</text><text x="120" y="394" font-size="12" font-weight="400" fill="#4A5668" text-anchor="start">A nyomások túlnyomásként (kijelzett értékként) szerepelnek, 0 bar = légköri nyomás.</text></svg>