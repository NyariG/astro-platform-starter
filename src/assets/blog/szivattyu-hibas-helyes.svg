<text x="40" y="48" font-size="13" font-weight="700" fill="#0A5AD1" letter-spacing="1.6">MENNYI EMELŐMAGASSÁG KELL? (8 M-ES SZINTKÜLÖNBSÉG)</text><path d="M40 62H760" stroke="#E2E8F0" stroke-width="1"/>
<path d="M60 330H520" stroke="#0B1626" stroke-width="2"/><rect x="110" y="121.20000000000002" width="130" height="144" fill="#E2E8F0" stroke="#0B1626" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="110" y="265.2" width="130" height="64.8" fill="#3B82F6" stroke="#0B1626" stroke-width="1.6"/><text x="175" y="191.20000000000002" font-size="14" font-weight="700" fill="#4A5668" text-anchor="middle">„fel kell nyomni”</text><text x="175" y="209.20000000000002" font-size="13" font-weight="400" fill="#4A5668" text-anchor="middle">8 m</text><text x="175" y="302.6" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">súrlódás 3,6 m</text><text x="175" y="356" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">Hibás számítás</text><text x="175" y="111.20000000000002" font-size="15" font-weight="700" fill="#C0392B" text-anchor="middle">11,6 m</text><rect x="330" y="265.2" width="130" height="64.8" fill="#3B82F6" stroke="#0B1626" stroke-width="1.6"/><text x="395" y="302.6" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">súrlódás 3,6 m</text><text x="395" y="255.2" font-size="15" font-weight="700" fill="#0A5AD1" text-anchor="middle">3,6 m</text><text x="395" y="356" font-size="14" font-weight="700" fill="#0A5AD1" text-anchor="middle">Helyes számítás</text><rect x="560" y="110" width="200" height="176" fill="#FFFFFF" stroke="#0B1626" stroke-width="1.6"/><text x="575" y="138" font-size="13" font-weight="700" fill="#C0392B" text-anchor="start">TÚL NAGY SZIVATTYÚ</text><text x="575" y="166" font-size="14" font-weight="700" fill="#0B1626" text-anchor="start">Drágább megvenni</text><text x="575" y="185" font-size="14" font-weight="700" fill="#0B1626" text-anchor="start">és üzemeltetni.</text><text x="575" y="214" font-size="14" font-weight="700" fill="#0B1626" text-anchor="start">Zajos, nehezebben</text><text x="575" y="233" font-size="14" font-weight="700" fill="#0B1626" text-anchor="start">szabályozható.</text><text x="575" y="262" font-size="14" font-weight="700" fill="#C0392B" text-anchor="start">Nem oda való.</text></svg>